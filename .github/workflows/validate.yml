name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate manifests and scripts
        run: ./scripts/validate.sh

      - name: Exercise build plans
        env:
          DRY_RUN: "1"
        run: |
          ./scripts/build-engine.sh 24.0.7 linux-x86_64
          ./scripts/build-engine.sh 24.0.7 macos-x86_64
          ./scripts/build-engine.sh 25.1.1 linux-x86_64
          ./scripts/build-engine.sh 25.1.1 macos-x86_64

      - name: Validate pinned Linux builder image
        run: docker build --platform linux/amd64 --file containers/linux/Containerfile .
